<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopDesk</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1a2233;--mute:#6b7690;--line:#e3e8f0;--brand:#1C4585;--good:#1e8e3e;--bad:#c5221f;--warn:#b06000;
--Voided:#FCE4E4;--Refunded:#FCE4E4;--Return:#FDEBD8;--Delivered:#E6F4EA;--InProgress:#FFF9C4;--Paid:#E8F0FE;--Pending:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--card:#181e2a;--ink:#e8ecf4;--mute:#8d98b0;--line:#2a3345;--brand:#4b7fd1;--good:#6fcf8a;--bad:#f28b82;--warn:#fbbc5a;
--Voided:#4a2226;--Refunded:#4a2226;--Return:#4a3520;--Delivered:#1f3a2a;--InProgress:#40391a;--Paid:#1f2f4f;--Pending:#181e2a}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:16px;margin:0 6px 4px;color:var(--brand)}nav .sub{margin:0 6px 12px;font-size:11px;color:var(--mute)}
nav h6{margin:12px 8px 4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
nav a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;margin-bottom:1px}
nav a:hover{background:var(--bg)}nav a.on{background:var(--brand);color:#fff}
nav a i{font-style:normal;width:20px;text-align:center}
nav .cnt{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
main{padding:16px 22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.top h2{margin:0;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card small{color:var(--mute)}.card b{display:block;font-size:20px;margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:16px}
.card h3,main h3{margin:0 0 10px;font-size:14px}main>#view>h3{margin-top:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,button,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{cursor:pointer}button:hover{filter:brightness(.95)}button.p{background:var(--brand);color:#fff;border-color:var(--brand)}
button.d{color:var(--bad)}button.s{padding:3px 8px;font-size:12px}
.tabs button.on{background:var(--brand);color:#fff}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.scroll{max-height:320px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th{background:var(--brand);color:#fff;padding:8px;text-align:left;white-space:nowrap;position:sticky;top:0}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{filter:brightness(.96)}
td input,td select{padding:4px 6px;width:100%;min-width:90px}
td.ck,th.ck{width:30px;text-align:center}td.ck input,th.ck input{width:auto;min-width:0}
td.r,th.r{text-align:right}
.b{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.tag{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.t-vip,.t-ok{background:#e6f4ea;color:#1e8e3e}.t-risk,.t-bad{background:#fce4e4;color:#c5221f}.t-blk{background:#222;color:#fff}.t-new{background:#e8f0fe;color:#1c4585}.t-warn{background:#fff3cd;color:#8a5a00}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--brand);border-radius:10px;padding:8px 10px;margin-bottom:12px}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0}.hbar span:first-child{width:110px;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .o{height:10px;background:var(--brand);border-radius:5px;min-width:2px}.hbar em{font-style:normal;font-size:12px}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.cols i{display:block;background:var(--brand);border-radius:4px 4px 0 0;margin-bottom:4px}
.alert{padding:8px 10px;border-radius:8px;background:var(--InProgress);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.muted{color:var(--mute)}.empty{padding:22px;text-align:center;color:var(--mute)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(620px,94vw);padding:18px;max-height:92vh}
dialog::backdrop{background:#0006}label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
dialog input,dialog select,dialog textarea,.form input,.form textarea,.form select{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:6px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.form{max-width:780px}.chk{display:inline-flex;align-items:center;gap:5px;margin:3px 12px 3px 0;font-size:13px;color:var(--ink)}.chk input{width:auto}
.big{font-size:22px;font-weight:700}
#toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.s{opacity:1}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px;align-items:center}
nav h1,nav .sub,nav h6{display:none}nav a{white-space:nowrap}main{padding:12px}}
</style>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main><div class="top"><h2 id="title"></h2><div><button id="sync">↻ Sync from Shopify</button> <button class="p" id="add">+ New order</button></div></div>
<div id="view"></div></main>
</div>
<dialog id="dlg"><form method="dialog" id="f"></form></dialog>
<div id="toast"></div>

<script>
// ===================== CONFIG =====================
const HEADERS=["Order No","Date","Description","Qty","C/B","Amount (PKR)","Status","Customer","Contact","Tracking ID","Courier","Courier Status","Custom","Comments"];
const KEYS=["no","date","desc","qty","cb","amount","status","cust","phone","track","courier","daak","denim","comments"];
const STATUSES=["Pending","Paid","In Progress","Delivered","Voided","Refunded","RETURN"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const REASONS=["Refused / not received","Wrong size","Damaged","Wrong item","Fake / unreachable","Other"];
const PAYM=["Cash","Bank transfer","Cheque","Wallet"],POSM=["Cash","Card","Bank transfer","Wallet"];
const NAV=[["Sell",[["pos","🏬","POS Sales"],["inventory","📚","Inventory"]]],
 ["Online orders",[["dashboard","📊","Dashboard"],["orders","🧾","Orders"],["dispatch","📦","Dispatch"],["returns","↩️","Returns"],["customers","👥","Customers"],["whatsapp","💬","WhatsApp"]]],
 ["Money",[["recon","🔁","COD Reconciliation"],["vendors","🏭","Vendors & Payables"],["finance","🧮","Finance"]]],
 ["Insight",[["products","🏷️","Product report"],["reports","📈","Reports & Data"],["settings","⚙️","Settings"]]]];
const cls=s=>s==="RETURN"?"Return":s.replace(" ","");
const DEF={shop:"My Store",couriers:["TCS","Leopards","M&P","PostEx","Trax"],courierFee:250,feeDeducted:true,returnFee:250,costPct:55,staleDays:3,blocked:[],cols:KEYS.slice(0,10),onlineLoc:"wh",
 tpl:{confirm:"Hello {name}! Your order {order} ({desc}) of Rs {amount} is confirmed. Payment: {cb}. Thank you for shopping with {shop}.",
 ship:"Hi {name}, your order {order} has been dispatched via {courier}. Tracking ID: {track}. Amount to pay: Rs {amount} ({cb}).",
 follow:"Hi {name}, hope you liked your order {order}! Please share your feedback with {shop}."}};

// Same rules as deriveStatus() in the Apps Script
function deriveStatus(fin,ful){fin=(fin||"").toLowerCase();ful=(ful||"").toLowerCase();
 if(fin==="voided")return"Voided";if(fin==="refunded")return"Refunded";
 if(ful==="fulfilled")return"Delivered";if(ful==="in_progress"||ful==="partial")return"In Progress";
 if(fin==="paid")return"Paid";return"Pending";}

// ===================== DATA LAYER =====================
// Everything lives in DB. Swap API.load/save for fetch() calls to your backend / Apps Script later.
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY="shopdesk_v1";
const blank=()=>({orders:[],settings:structuredClone(DEF),stores:[],vendors:[],products:[],bills:[],vpay:[],posSales:[],moves:[],remits:[],dispatches:[]});
const norm=d=>({...blank(),...d,settings:{...DEF,...d.settings,tpl:{...DEF.tpl,...(d.settings||{}).tpl}}});
const API={
 load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.orders)return norm(s)}catch(e){}return seed()},
 save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
};
function seed(){
 let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;const now=new Date();const day=n=>iso(new Date(now.getFullYear(),now.getMonth(),now.getDate()-n));
 const d=blank();
 d.stores=[{id:"wh",name:"Online / Warehouse"},{id:"s1",name:"Main Store"},{id:"s2",name:"Mall Outlet"}];
 d.vendors=[{id:"v1",name:"Karachi Garments Co.",phone:"03001112233",terms:30},{id:"v2",name:"Lahore Denim House",phone:"03214445566",terms:15},{id:"v3",name:"Imported Accessories Ltd",phone:"03337778899",terms:30}];
 [["HUGO BOSS POLO",2800,4900,"v1"],["LEVI'S 501 DENIM",3200,5800,"v2"],["ZARA OVERSHIRT",2400,4200,"v1"],["NIKE TECH FLEECE",4300,7500,"v1"],
  ["CK BOXER PACK",1200,2400,"v3"],["TOMMY HILFIGER CAP",900,1800,"v3"],["H&M CHINOS",2000,3800,"v2"],["LEATHER BELT",700,1600,"v3"]].forEach((p,i)=>
  d.products.push({id:"p"+i,sku:"SKU"+(100+i),name:p[0],cost:p[1],price:p[2],vendor:p[3],reorder:10,
   stock:i===5?{wh:3,s1:2,s2:1}:{wh:20+(i*7)%25,s1:4+(i*2)%9,s2:3+i%6}}));
 const names=["Ali Raza","Sara Khan","Usman Tariq","Ayesha Malik","Bilal Ahmed","Hina Shah","Hamza Iqbal","Noor Fatima","Zain Ali","Maryam Aslam","Fahad Butt"];
 const fins=[["pending",null],["paid",null],["paid","fulfilled"],["pending","fulfilled"],["pending","in_progress"],["voided",null],["refunded",null],["pending","fulfilled"],["pending","fulfilled"]];
 const cour=["TCS","Leopards","PostEx","Trax"],sizes=["S","M","L","XL"];
 for(let i=0;i<70;i++){
  const p=d.products[(i*5)%7],[fi,fu]=fins[(i*3+i%5)%fins.length];let st=deriveStatus(fi,fu);
  const cb=fi==="paid"?"ONLINE":"COD";if(i%11===4&&st==="Delivered")st="RETURN";const shipped=["Delivered","In Progress","RETURN"].includes(st),qty=1+i%3;
  d.orders.push({no:"#"+(1400-i),date:day(Math.floor(i*1.7)),desc:p.name+" ("+sizes[i%4]+")",qty,cb,amount:p.price*qty,status:st,cust:names[i%names.length],
   phone:"03"+(i%5)+"1"+String(2000000+(i%names.length)*31337).slice(0,7),track:shipped?"TRK"+(700000+i*37):"",courier:shipped?cour[i%cour.length]:"",
   daak:st==="Delivered"?"Delivered":"",denim:"",comments:"",settled:cb==="ONLINE"||(st==="Delivered"&&i>18),reason:st==="RETURN"?REASONS[i%REASONS.length]:"",stocked:shipped,restocked:st==="RETURN"});
 }
 d.orders.filter(o=>o.track).forEach(o=>d.dispatches.push({id:uid(),ts:new Date(o.date+"T10:00").getTime(),date:o.date,no:o.no,cust:o.cust,phone:o.phone,courier:o.courier,track:o.track,cod:o.cb==="COD"?o.amount:0}));
 const g={};d.orders.filter(o=>o.cb==="COD"&&o.settled&&o.status==="Delivered").forEach(o=>(g[o.courier]=g[o.courier]||[]).push(o));
 Object.entries(g).forEach(([c,os],i)=>{const ex=os.reduce((s,o)=>s+o.amount-DEF.courierFee,0),id=uid();os.forEach(o=>o.remitId=id);
  d.remits.push({id,date:day(2+i),courier:c,ref:"RMT-"+(200+i),expected:ex,received:i===1?ex-500:ex,orders:os.map(o=>o.no)})});
 [[40,"v1",[[0,30,2800],[2,20,2400]],"wh",1],[32,"v2",[[1,25,3200],[6,20,2000]],"wh",1],[24,"v3",[[4,40,1200],[5,30,900],[7,20,700]],"wh",1],[12,"v1",[[3,15,4300]],"s1",1],[5,"v2",[[1,10,3200]],"s2",1]].forEach(([ago,v,ls,loc],i)=>{
  const items=ls.map(([pi,q,c])=>({pid:"p"+pi,qty:q,cost:c}));d.bills.push({id:"b"+i,date:day(ago),vendor:v,ref:"INV-"+(500+i),items,total:items.reduce((s,x)=>s+x.qty*x.cost,0),loc})});
 [[35,"v1",60000],[20,"v2",50000],[10,"v3",40000]].forEach(([ago,v,a],i)=>d.vpay.push({id:"vp"+i,date:day(ago),vendor:v,amount:a,method:"Bank transfer",ref:"TRF-"+(900+i),note:""}));
 for(let k=0;k<46;k++){const st=k%2?"s1":"s2",n=1+Math.floor(rnd()*2),items=[];
  for(let j=0;j<n;j++){const p=d.products[Math.floor(rnd()*8)],q=1+Math.floor(rnd()*2);items.push({pid:p.id,name:p.name,qty:q,price:p.price,cost:p.cost})}
  const sub=items.reduce((s,x)=>s+x.qty*x.price,0),disc=k%7===0?200:0;
  d.posSales.push({id:uid(),no:"POS-"+(1000+k),date:day(Math.floor(k/3)),time:pad(10+k%9)+":"+pad((k*7)%60),store:st,items,discount:disc,total:sub-disc,method:POSM[k%3],void:false})}
 return d;
}
let DB=API.load(),SET=DB.settings;const commit=()=>API.save();
const sel=new Set();let CUR="dashboard";

// ===================== HELPERS =====================
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=a=>a.reduce((s,o)=>s+Number(o.amount||0),0);
const pkr=n=>"Rs "+Math.round(n).toLocaleString();
const num=n=>Number(n||0).toLocaleString();
const fmtDate=s=>{if(!s)return"";const d=new Date(s+"T00:00");return pad(d.getDate())+"-"+MONTHS[d.getMonth()]+"-"+String(d.getFullYear()).slice(-2)};
const monthOf=s=>{const d=new Date(s+"T00:00");return MONTHS[d.getMonth()]+"-"+String(d.getFullYear()).slice(-2)};
const age=s=>Math.floor((Date.now()-new Date(s+"T00:00"))/864e5);
const today=()=>iso(new Date()),monthStart=()=>iso(new Date(new Date().getFullYear(),new Date().getMonth(),1));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("s");setTimeout(()=>t.classList.remove("s"),2200)};
const isShipped=o=>["Delivered","In Progress","RETURN"].includes(o.status);
const dead=o=>["Voided","Refunded","RETURN"].includes(o.status);
const live=()=>DB.orders.filter(o=>!dead(o));
const codDue=o=>o.cb==="COD"&&o.status==="Delivered"&&!o.settled;
const inTransit=o=>o.cb==="COD"&&o.status==="In Progress";
const ready=o=>(o.status==="Pending"||o.status==="Paid")&&!o.track;
const badge=s=>`<span class="b" style="background:var(--${cls(s)})">${esc(s)}</span>`;
const tag=(t,c)=>`<span class="tag t-${c}">${esc(t)}</span>`;
const opts=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
const kv=(a,v,ph)=>(ph?`<option value="">${ph}</option>`:"")+a.map(([k,l])=>`<option value="${esc(k)}" ${k===v?"selected":""}>${esc(l)}</option>`).join("");
const byNo=no=>DB.orders.find(o=>o.no===no),pById=id=>DB.products.find(p=>p.id===id),vById=id=>DB.vendors.find(v=>v.id===id);
const storeName=id=>(DB.stores.find(s=>s.id===id)||{name:id||"—"}).name;
const storeKV=()=>DB.stores.map(s=>[s.id,s.name]),prodKV=()=>DB.products.map(p=>[p.id,p.name+" ("+p.sku+")"]),vendKV=()=>DB.vendors.map(v=>[v.id,v.name]);
const stockOf=(p,l)=>p.stock[l]||0,totalStock=p=>Object.values(p.stock).reduce((a,b)=>a+b,0);
const normPhone=p=>{p=String(p||"").replace(/\D/g,"");return p.startsWith("0")?"92"+p.slice(1):p};
const T=(h,rows,right=[])=>rows.length?`<div class="wrap"><table><thead><tr>${h.map((x,i)=>`<th class="${right.includes(i)?"r":""}">${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`:'<div class="wrap"><div class="empty">Nothing here yet.</div></div>';
function download(name,rows){const csv=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;a.click()}
const ordersToRows=os=>[HEADERS.concat("Settled","Return reason"),...os.map(o=>KEYS.map(k=>o[k]).concat(o.settled?"Yes":"No",o.reason||""))];
function printDoc(title,html){const w=window.open("","_blank");if(!w)return toast("Allow pop-ups to print");
 w.document.write(`<title>${esc(title)}</title><style>body{font:13px Arial;margin:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:5px;text-align:left}.slip{border:2px dashed #555;padding:10px;margin:10px 0;page-break-inside:avoid}.r{text-align:right}</style><h2>${esc(title)}</h2>${html}`);
 w.document.close();w.focus();setTimeout(()=>w.print(),300)}
function fillTpl(t,o){return SET.tpl[t].replace(/\{(\w+)\}/g,(_,k)=>({name:o.cust,order:o.no,desc:o.desc,amount:num(o.amount),cb:o.cb,courier:o.courier||"courier",track:o.track||"(pending)",shop:SET.shop})[k]??"")}
function hbars(items,fmt=v=>v){const m=Math.max(1,...items.map(i=>i[1]));return items.map(([l,v])=>`<div class="hbar"><span title="${esc(l)}">${esc(l)}</span><div class="o" style="width:${Math.max(0,v)/m*55}%"></div><em>${fmt(v)}</em></div>`).join("")||'<div class="empty">No data</div>'}

// generic modal: html body, ok(FormData) returns false to keep open
function modal(html,ok,{label="Save",extra=""}={}){
 $("#f").innerHTML=html+`<div class="act">${extra}<button type="button" id="x">Cancel</button><button class="p" value="ok">${label}</button></div>`;
 $("#dlg").showModal();$("#x").onclick=()=>$("#dlg").close();
 $("#f").onsubmit=ev=>{if(ev.submitter?.value!=="ok")return;if(ok(new FormData($("#f")),ev)===false)ev.preventDefault()}}
const fld=(n,l,v="",t="text",x="")=>`<div><label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${x}></div>`;
const sfld=(n,l,html)=>`<div><label>${l}</label><select name="${n}">${html}</select></div>`;

// ---- stock engine (one shared inventory across all locations)
function move(pid,loc,qty,type,ref){const p=pById(pid);if(!p)return;p.stock[loc]=(p.stock[loc]||0)+qty;
 DB.moves.unshift({id:uid(),ts:Date.now(),date:today(),pid,loc,qty,type,ref:ref||""});if(DB.moves.length>3000)DB.moves.length=3000}
const baseName=d=>String(d).replace(/ \(.*/,"").trim().toLowerCase();
const findProd=desc=>DB.products.find(p=>p.name.toLowerCase()===baseName(desc));
function afterStatus(o){const p=findProd(o.desc);if(!p)return;
 if((o.status==="In Progress"||o.status==="Delivered")&&!o.stocked){move(p.id,SET.onlineLoc,-o.qty,"online sale",o.no);o.stocked=true}
 if(o.status==="RETURN"&&o.stocked&&!o.restocked){move(p.id,SET.onlineLoc,o.qty,"online return",o.no);o.restocked=true}}
function logDispatch(o){DB.dispatches.unshift({id:uid(),ts:Date.now(),date:today(),no:o.no,cust:o.cust,phone:o.phone,courier:o.courier,track:o.track,cod:o.cb==="COD"?Number(o.amount):0})}

// ---- money engine
const posLive=()=>DB.posSales.filter(s=>!s.void);
const saleCost=s=>s.items.reduce((a,i)=>a+i.cost*i.qty,0);
function billRows(){const out=[];DB.vendors.forEach(v=>{let pool=DB.vpay.filter(x=>x.vendor===v.id).reduce((s,x)=>s+Number(x.amount),0);
 DB.bills.filter(b=>b.vendor===v.id).sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{const p=Math.min(b.total,pool);pool-=p;out.push({...b,paid:p,due:b.total-p,terms:v.terms})})});return out}

 clearSel(){sel.clear();document.querySelectorAll("[data-sel],[data-all]").forEach(c=>c.checked=false);onSel()},
 bulkApply(){const s=$("#bs").value,c=$("#bc").value;if(!s&&!c)return toast("Pick a status or courier");const n=sel.size;selRows().forEach(o=>{if(s){o.status=s;afterStatus(o)}if(c)o.courier=c});commit();toast("Updated "+n);refresh()},
 bulkSettle(){let n=0;selRows().forEach(o=>{if(o.cb==="COD"){o.settled=true;n++}});commit();toast(n+" marked settled");refresh()},
 bulkCsv(){download("selected-orders.csv",ordersToRows(selRows()))},bulkSlip(){slips(selRows())},
 bulkDel(){if(confirm("Delete "+sel.size+" order(s)? This cannot be undone.")){DB.orders=DB.orders.filter(o=>!sel.has(o.no));commit();refresh()}},
 dispSave(){let n=0;document.querySelectorAll("[data-dt]").forEach(i=>{const v=i.value.trim();if(!v)return;const o=byNo(i.dataset.dt);o.track=v;o.courier=$(`[data-dc="${CSS.escape(o.no)}"]`).value;o.status="In Progress";afterStatus(o);logDispatch(o);n++});
  n?(commit(),toast(n+" order(s) dispatched & logged"),refresh()):toast("Enter at least one tracking ID")},
 dispPrint(){printDoc("Dispatch list — "+today(),`<table><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Product</th><th>Qty</th><th>COD</th></tr>`+vis.map(o=>`<tr><td>${esc(o.no)}</td><td>${esc(o.cust)}</td><td>${esc(o.phone)}</td><td>${esc(o.desc)}</td><td>${o.qty}</td><td>${o.cb==="COD"?num(o.amount):"PAID"}</td></tr>`).join("")+"</table>")},
 dispSlips(){slips(vis)},
 dlogCsv(){download("dispatch-record.csv",[["Date","Order","Customer","Phone","Courier","Tracking","COD amount"],...dLogRows().map(d=>[d.date,d.no,d.cust,d.phone,d.courier,d.track,d.cod])])},
 dlogPrint(){printDoc("Dispatch record",T(["Date","Order","Customer","Courier","Tracking","COD"],dLogRows().map(d=>`<tr><td>${d.date}</td><td>${esc(d.no)}</td><td>${esc(d.cust)}</td><td>${esc(d.courier)}</td><td>${esc(d.track)}</td><td>${d.cod||"prepaid"}</td></tr>`)))},
 reconSave(){const rows=selRows();if(!rows.length)return toast("Tick the orders covered");if(RC.received==="")return toast("Enter the amount received");
  const exp=sum(rows)-(SET.feeDeducted?SET.courierFee*rows.length:0),id=uid();rows.forEach(o=>{o.settled=true;o.remitId=id});
  DB.remits.push({id,date:RC.date||today(),courier:RC.courier,ref:RC.ref,expected:exp,received:Number(RC.received),orders:rows.map(o=>o.no)});
  RC.received="";RC.ref="";commit();toast("Remittance recorded — "+rows.length+" orders settled");refresh()},
 cartAdd(t){cartAdd(t.dataset.id);drawCart()},
 cartInc(t){P.cart.find(i=>i.pid===t.dataset.id).qty++;drawCart()},
 cartDec(t){const i=P.cart.find(i=>i.pid===t.dataset.id);if(--i.qty<=0)P.cart=P.cart.filter(x=>x!==i);drawCart()},
 cartDel(t){P.cart=P.cart.filter(i=>i.pid!==t.dataset.id);drawCart()},
 cartClear(){P.cart=[];P.disc=0;drawCart()},
 posComplete(){if(!P.cart.length)return toast("Cart is empty");
  const bad=P.cart.find(i=>stockOf(pById(i.pid),P.store)<i.qty);if(bad&&!confirm(`Only ${stockOf(pById(bad.pid),P.store)} of "${pById(bad.pid).name}" in ${storeName(P.store)}. Sell anyway (stock goes negative)?`))return;
  const n=Math.max(1000,...DB.posSales.map(s=>parseInt(s.no.slice(4))||0))+1,now=new Date();
  const s={id:uid(),no:"POS-"+n,date:today(),time:pad(now.getHours())+":"+pad(now.getMinutes()),store:P.store,items:P.cart.map(i=>{const p=pById(i.pid);return{pid:p.id,name:p.name,qty:i.qty,price:i.price,cost:p.cost}}),
   discount:+P.disc||0,total:cartTotal(),method:P.method,void:false};
  s.items.forEach(i=>move(i.pid,P.store,-i.qty,"pos sale",s.no));DB.posSales.push(s);P.last=s.id;P.cart=[];P.disc=0;commit();toast("Sale "+s.no+" — "+pkr(s.total));drawPos()},
 posReceipt(){const s=DB.posSales.find(x=>x.id===P.last);if(!s)return;
  printDoc(SET.shop+" — Receipt",`<p>${esc(storeName(s.store))}<br>${s.no} · ${fmtDate(s.date)} ${s.time}</p>`+T(["Item","Qty","Price","Total"],s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td class="r">${num(i.price)}</td><td class="r">${num(i.qty*i.price)}</td></tr>`),[2,3])+`<p>${s.discount?"Discount: "+num(s.discount)+"<br>":""}<b>Total: Rs ${num(s.total)}</b> (${s.method})</p><p>Thank you!</p>`)},
 posCsv(){download("pos-sales.csv",[["No","Date","Time","Store","Items","Discount","Total","Method","Voided"],...DB.posSales.map(s=>[s.no,s.date,s.time,storeName(s.store),s.items.map(i=>i.qty+"x "+i.name).join("; "),s.discount,s.total,s.method,s.void?"Yes":""])])},
 newProduct(){openProduct()},transfer(){openTransfer()},toggleMoves(){IV.moves=!IV.moves;refresh()},
 invCsv(){download("inventory.csv",[["SKU","Product","Vendor","Cost","Price",...DB.stores.map(s=>s.name),"Total","Value at cost"],...DB.products.map(p=>[p.sku,p.name,(vById(p.vendor)||{}).name||"",p.cost,p.price,...DB.stores.map(s=>stockOf(p,s.id)),totalStock(p),totalStock(p)*p.cost])])},
 newVendor(){openVendor()},newBill(t){openBill(t.dataset.id)},newPay(t){openPay(t.dataset.id)},
 repCsv(){download(`summary-${R.from}-to-${R.to}.csv`,[...document.querySelectorAll("#rtab tr")].map(r=>[...r.children].map(c=>c.textContent)))},
 repOrders(){download("orders-report.csv",ordersToRows(repRows()))},repPrint(){printDoc("Sales report "+R.from+" to "+R.to,$("#rp").innerHTML)},
 exportAll(){download("orders.csv",ordersToRows(DB.orders))},
 backup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:"application/json"}));a.download="shopdesk-backup.json";a.click()},
 reset(){if(confirm("Replace ALL data with fresh demo data?")){localStorage.removeItem(KEY);DB=API.load();SET=DB.settings;commit();refresh()}},
 addLine(){$("#lines").insertAdjacentHTML("beforeend",billLine())},
 saveSettings(){SET.shop=$("#s-shop").value||DEF.shop;SET.couriers=$("#s-cour").value.split(",").map(s=>s.trim()).filter(Boolean);
  SET.courierFee=+$("#s-cf").value||0;SET.returnFee=+$("#s-rf").value||0;SET.costPct=+$("#s-cp").value||0;SET.staleDays=+$("#s-sd").value||1;SET.feeDeducted=$("#s-fd").checked;
  SET.cols=[...document.querySelectorAll("[data-col]:checked")].map(c=>c.dataset.col);["confirm","ship","follow"].forEach(k=>SET.tpl[k]=$("#t-"+k).value);
  const lines=$("#s-stores").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!lines.length)return toast("Keep at least one location");
  lines.forEach((n,i)=>DB.stores[i]?DB.stores[i].name=n:DB.stores.push({id:uid(),name:n}));
  while(DB.stores.length>lines.length){const s=DB.stores[DB.stores.length-1];if(s.id===$("#s-online").value||DB.products.some(p=>stockOf(p,s.id))||DB.posSales.some(x=>x.store===s.id)){toast("Kept “"+s.name+"” — it still has stock or sales");break}DB.stores.pop()}
  SET.onlineLoc=DB.stores.some(s=>s.id===$("#s-online").value)?$("#s-online").value:DB.stores[0].id;commit();toast("Settings saved");route()}
};
function slips(os){if(!os.length)return toast("Nothing to print");printDoc("Shipping slips",os.map(o=>`<div class="slip"><b>${esc(o.no)}</b> — ${esc(o.courier||"")} ${esc(o.track||"")}<br><b>${esc(o.cust)}</b> · ${esc(o.phone)}<br>${esc(o.desc)} × ${o.qty}<br><b>${o.cb==="COD"?"COLLECT Rs "+num(o.amount):"PREPAID"}</b></div>`).join(""))}
function undoRemit(id){if(!confirm("Undo this remittance? Its orders return to “awaiting remittance”."))return;
 DB.orders.forEach(o=>{if(o.remitId===id){o.settled=false;delete o.remitId}});DB.remits=DB.remits.filter(r=>r.id!==id);commit();refresh()}
function voidSale(id){const s=DB.posSales.find(x=>x.id===id);if(!s||!confirm("Void "+s.no+"? Stock will be returned to "+storeName(s.store)+"."))return;
 s.void=true;s.items.forEach(i=>move(i.pid,s.store,i.qty,"pos void",s.no));commit();drawPos()}
function importCsv(f){if(!f)return;f.text().then(txt=>{const rows=[];let r=[],c="",q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt[i+1]==="\n")i++;r.push(c);c="";rows.push(r);r=[]}else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}let n=0;
 rows.slice(1).forEach(r=>{if(!r[0]||byNo(r[0]))return;const o={};KEYS.forEach((k,i)=>o[k]=r[i]??"");o.qty=+o.qty||1;o.amount=+o.amount||0;
  const d=new Date(o.date);o.date=isNaN(d)?today():iso(d);o.settled=(r[14]||"").toLowerCase()==="yes"||o.cb==="ONLINE";o.reason=r[15]||"";DB.orders.push(o);n++});
 commit();toast(n+" order(s) imported");refresh()})}
function restore(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.orders))throw 0;DB=norm(d);SET=DB.settings;commit();toast("Restored");refresh()}catch(e){toast("Invalid backup file")}})}

// ===================== DIALOGS =====================
function openProduct(p){const isNew=!p;p=p||{sku:"SKU"+(100+DB.products.length),name:"",cost:0,price:0,vendor:"",reorder:10,stock:{}};
 modal(`<h3 style="margin:0">${isNew?"New product":"Edit "+esc(p.name)}</h3><div class="two">${fld("sku","SKU / barcode",p.sku)}${fld("name","Product name",p.name,"text","required")}</div>
 <div class="two">${fld("cost","Cost price",p.cost,"number")}${fld("price","Selling price",p.price,"number")}</div><div class="two">${sfld("vendor","Vendor",kv(vendKV(),p.vendor,"—"))}${fld("reorder","Reorder level (total units)",p.reorder,"number")}</div>
 <label>${isNew?"Opening stock":"Stock on hand"} per location (changes are logged as adjustments)</label><div class="two">${DB.stores.map(s=>fld("st_"+s.id,esc(s.name),stockOf(p,s.id),"number")).join("")}</div>`,fd=>{
  const d=Object.fromEntries(fd);if(DB.products.some(x=>x!==p&&x.sku===d.sku)){toast("SKU already exists");return false}
  const t=isNew?{id:"p"+uid(),stock:{}}:p;Object.assign(t,{sku:d.sku,name:d.name,cost:+d.cost,price:+d.price,vendor:d.vendor,reorder:+d.reorder});
  if(isNew)DB.products.push(t);
  DB.stores.forEach(s=>{const diff=Math.round(+d["st_"+s.id]||0)-stockOf(t,s.id);if(diff)move(t.id,s.id,diff,isNew?"opening stock":"adjustment")});
  commit();toast("Product saved");refresh()},
  {extra:isNew?"":'<button type="button" id="delp" class="d">Delete</button>'});
 if(!isNew)$("#delp").onclick=()=>{if(confirm("Delete "+p.name+"?")){DB.products=DB.products.filter(x=>x!==p);$("#dlg").close();commit();refresh()}}}
function openTransfer(){if(DB.stores.length<2)return toast("Add a second location in Settings");
 modal(`<h3 style="margin:0">Transfer stock between locations</h3>${sfld("pid","Product",kv(prodKV()))}<div class="two">${sfld("from","From",kv(storeKV(),DB.stores[0].id))}${sfld("to","To",kv(storeKV(),DB.stores[1].id))}</div>${fld("qty","Quantity",1,"number",'min="1"')}`,fd=>{
  const d=Object.fromEntries(fd),p=pById(d.pid),q=Math.round(+d.qty);if(d.from===d.to){toast("Pick two different locations");return false}
  if(q<1||stockOf(p,d.from)<q){toast("Only "+stockOf(p,d.from)+" available in "+storeName(d.from));return false}
  move(p.id,d.from,-q,"transfer out","→ "+storeName(d.to));move(p.id,d.to,q,"transfer in","← "+storeName(d.from));commit();toast("Transferred "+q+" × "+p.name);refresh()},{label:"Transfer"})}
function openVendor(v){const isNew=!v;v=v||{name:"",phone:"",terms:30};
 modal(`<h3 style="margin:0">${isNew?"New vendor":"Edit vendor"}</h3>${fld("name","Vendor name",v.name,"text","required")}<div class="two">${fld("phone","Phone",v.phone)}${fld("terms","Payment terms (days)",v.terms,"number")}</div>`,fd=>{
  const d=Object.fromEntries(fd);isNew?DB.vendors.push({id:"v"+uid(),name:d.name,phone:d.phone,terms:+d.terms||0}):Object.assign(v,{name:d.name,phone:d.phone,terms:+d.terms||0});commit();refresh()})}
const billLine=()=>`<div class="three"><select name="pid" data-pl>${kv(prodKV(),"","Product…")}</select><input name="qty" type="number" min="0" placeholder="Qty"><input name="cost" type="number" min="0" placeholder="Unit cost"></div>`;
function openBill(vid){if(!DB.vendors.length)return toast("Add a vendor first");
 modal(`<h3 style="margin:0">Purchase bill (goods received)</h3><div class="two">${sfld("vendor","Vendor",kv(vendKV(),vid))}${fld("date","Bill date",today(),"date")}</div><div class="two">${fld("ref","Bill / invoice no.")}${sfld("loc","Receive stock into",kv(storeKV(),SET.onlineLoc,"— don't add stock —"))}</div>
 <label>Items</label><div id="lines">${billLine().repeat(3)}</div><button type="button" class="s" data-act="addLine">+ line</button><div class="two">${fld("paid","Paid now (optional)",0,"number")}${sfld("method","Payment method",opts(PAYM))}</div>`,fd=>{
  const pids=fd.getAll("pid"),qs=fd.getAll("qty"),cs=fd.getAll("cost"),items=[];pids.forEach((id,i)=>{if(id&&+qs[i]>0)items.push({pid:id,qty:Math.round(+qs[i]),cost:+cs[i]||pById(id).cost})});
  if(!items.length){toast("Add at least one item");return false}
  const b={id:"b"+uid(),date:fd.get("date"),vendor:fd.get("vendor"),ref:fd.get("ref"),items,total:items.reduce((s,x)=>s+x.qty*x.cost,0),loc:fd.get("loc")};DB.bills.push(b);
  if(b.loc)items.forEach(i=>{move(i.pid,b.loc,i.qty,"purchase",b.ref||"bill");pById(i.pid).cost=i.cost});
  if(+fd.get("paid")>0)DB.vpay.push({id:"vp"+uid(),date:b.date,vendor:b.vendor,amount:+fd.get("paid"),method:fd.get("method"),ref:b.ref,note:"Paid with bill"});commit();toast("Bill "+pkr(b.total)+" saved");refresh()},{label:"Save bill"})}
function openPay(vid){if(!DB.vendors.length)return toast("Add a vendor first");const bal=vid?Math.max(0,vendorBal(vid)):0;
 modal(`<h3 style="margin:0">Payment to vendor</h3>${sfld("vendor","Vendor",kv(vendKV(),vid))}<div class="two">${fld("date","Date",today(),"date")}${fld("amount","Amount (PKR)",bal||"","number",'min="1" required')}</div>
 <div class="two">${sfld("method","Method",opts(PAYM))}${fld("ref","Reference / cheque no.")}</div>${fld("note","Note")}`,fd=>{
  const d=Object.fromEntries(fd);DB.vpay.push({id:"vp"+uid(),date:d.date,vendor:d.vendor,amount:+d.amount,method:d.method,ref:d.ref,note:d.note});commit();toast("Payment recorded");refresh()},{label:"Record payment"})}
function statement(vid){const v=vById(vid),ev=[...DB.bills.filter(b=>b.vendor===vid).map(b=>({d:b.date,t:"Bill "+b.ref,dr:b.total,cr:0})),...DB.vpay.filter(x=>x.vendor===vid).map(x=>({d:x.date,t:"Payment ("+x.method+") "+x.ref,dr:0,cr:+x.amount}))].sort((a,b)=>a.d.localeCompare(b.d));
 let bal=0;printDoc("Statement — "+v.name,T(["Date","Description","Bills","Payments","Balance"],ev.map(e=>{bal+=e.dr-e.cr;return`<tr><td>${fmtDate(e.d)}</td><td>${esc(e.t)}</td><td class="r">${e.dr?num(e.dr):""}</td><td class="r">${e.cr?num(e.cr):""}</td><td class="r">${num(bal)}</td></tr>`}))+`<p><b>Balance due: Rs ${num(bal)}</b></p>`)}

function openForm(o){const isNew=!o,oldTrack=o?o.track:"";
 o=o||{no:"#"+(Math.max(1300,...DB.orders.map(x=>parseInt(x.no.slice(1))||0))+1),date:today(),desc:"",qty:1,cb:"COD",amount:0,status:"Pending",cust:"",phone:"",track:"",courier:"",daak:"",denim:"",comments:"",settled:false,reason:""};
 const inp=(k,l,t="text")=>fld(k,l,o[k],t);
 modal(`<h3 style="margin:0">${isNew?"New order":"Order "+esc(o.no)}</h3><div class="two">${inp("no","Order No")}${inp("date","Date","date")}</div>${inp("desc","Description (product name + variant)")}
 <div class="two">${inp("qty","Qty","number")}${inp("amount","Amount (PKR)","number")}</div><div class="two">${sfld("cb","C/B",opts(["COD","ONLINE"],o.cb))}${sfld("status","Status",opts(STATUSES,o.status))}</div>
 <div class="two">${inp("cust","Customer")}${inp("phone","Contact")}</div><div class="two">${inp("track","Tracking ID")}${sfld("courier","Courier",kv(SET.couriers.map(c=>[c,c]),o.courier,"—"))}</div>
 <div class="two">${inp("daak","Courier status")}${inp("denim","Custom field")}</div>
 <div class="two">${sfld("reason","Return reason",kv(REASONS.map(c=>[c,c]),o.reason,"—"))}<div><label>COD settled by courier</label><select name="settled"><option value="0">No</option><option value="1" ${o.settled?"selected":""}>Yes</option></select></div></div>
 <label>Comments</label><textarea name="comments" rows="2">${esc(o.comments)}</textarea>`,(fd,ev)=>{
  const d=Object.fromEntries(fd);d.qty=+d.qty;d.amount=+d.amount;d.settled=d.settled==="1"||d.cb==="ONLINE";
  if(d.phone.startsWith("+92"))d.phone="0"+d.phone.slice(3);d.phone=d.phone.replace(/\s+/g,"");
  if(isNew){if(DB.orders.some(x=>x.no===d.no)){toast("Order no. already exists");return false}
   if(SET.blocked.includes(d.phone)&&!confirm("This customer is BLOCKED. Save the order anyway?"))return false;DB.orders.push(o)}
  Object.assign(o,d);afterStatus(o);if(o.track&&o.track!==oldTrack)logDispatch(o);commit();toast("Saved");refresh()},
  {extra:isNew?"":'<button type="button" id="del" class="d">Delete</button><button type="button" id="wa">WhatsApp</button>'});
 if(!isNew){$("#del").onclick=()=>{if(confirm("Delete "+o.no+"?")){DB.orders=DB.orders.filter(x=>x!==o);$("#dlg").close();commit();refresh()}};
  $("#wa").onclick=()=>window.open("https://wa.me/"+normPhone(o.phone)+"?text="+encodeURIComponent(fillTpl(o.status==="In Progress"?"ship":o.status==="Delivered"?"follow":"confirm",o)),"_blank")}}
route();
</script>
